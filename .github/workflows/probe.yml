name: probe
on: { push: { branches: [probe] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add probe.json; git commit -m "probe result"; git push
