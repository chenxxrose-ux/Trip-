<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港注意事項</title><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:#1d1d1f;font:17px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
.w{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;line-height:1.3;margin:4px 0 4px}
.sub{color:#6e6e73;font-size:15px;margin:0 0 14px}
.bar{position:sticky;top:0;background:#fff;padding:10px 0 12px;border-bottom:1px solid #e5e5ea;z-index:2;display:flex;align-items:center;gap:12px}
.track{flex:1;height:8px;background:#f2f2f7;border-radius:4px;overflow:hidden}.fill{height:100%;width:0;background:#34c759;transition:width .2s}
.cnt{font-variant-numeric:tabular-nums;font-size:15px;color:#3a3a3c;min-width:4.5em;text-align:right}
h2{font-size:19px;margin:26px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:14px;color:#8e8e93;font-weight:400;font-variant-numeric:tabular-nums}
.box{background:#f5f5f7;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.box b{color:#1d1d1f}
ul{list-style:none;margin:0;padding:0}
li label{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid #f0f0f2;cursor:pointer;-webkit-tap-highlight-color:transparent}
li input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border:2px solid #c7c7cc;border-radius:7px;display:grid;place-content:center;background:#fff}
li input:checked{background:#34c759;border-color:#34c759}
li input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
li span{flex:1;min-width:0}li .n{display:block;color:#6e6e73;font-size:14px;margin-top:2px}
li input:checked+span{color:#8e8e93}li input:checked+span b{color:#8e8e93}
.foot{margin-top:28px;display:flex;justify-content:space-between;align-items:center;color:#8e8e93;font-size:13px;gap:12px}
button{white-space:nowrap;flex:none;font:inherit;font-size:14px;color:#ff3b30;background:#fff;border:1px solid #e5e5ea;border-radius:10px;padding:8px 14px}
a.sw{color:#0071e3;text-decoration:none;font-size:15px}</style></head><body data-k="hk-notes-v1"><div class="w"><h1>香港注意事項</h1><p class="sub">11/23–11/25・做完就勾</p><div class="bar"><div class="track"><div class="fill"></div></div><div class="cnt"></div></div><section><h2>📋 出發前<small></small></h2><ul><li><label><input type="checkbox" id="i1"><span><b>旅平險＋旅遊不便險</b><span class="n">不便險管班機延誤、行李遺失</span></span></label></li><li><label><input type="checkbox" id="i2"><span>7 個人的<b>台胞證效期</b><span class="n">要到 11/25 之後</span></span></label></li><li><label><input type="checkbox" id="i3"><span><b>去程香港快運線上報到</b><span class="n">開放後就先辦</span></span></label></li><li><label><input type="checkbox" id="i4"><span><b>回程華航報到</b><span class="n">另外訂的 2 位也要辦</span></span></label></li><li><label><input type="checkbox" id="i5"><span><b>截圖存手機</b><span class="n">機票、飯店、Aqua Luna 船票、Pici 訂位，沒網路也能看</span></span></label></li><li><label><input type="checkbox" id="i6"><span>出發前一週看<b>天文台天氣、颱風</b></span></label></li></ul></section><section><h2>⏰ 當天一定要準時<small></small></h2><ul><li><label><input type="checkbox" id="i7"><span><b>11/23 香港快運櫃台 09:10 關櫃</b><span class="n">晚到就上不了飛機</span></span></label></li><li><label><input type="checkbox" id="i8"><span><b>Aqua Luna 18:30 前到碼頭</b><span class="n">開船前 15 分鐘</span></span></label></li><li><label><input type="checkbox" id="i9"><span><b>11/25 照行程表時間離開市區</b><span class="n">不要逛過頭</span></span></label></li></ul></section><section><h2>💰 錢<small></small></h2><ul><li><label><input type="checkbox" id="i10"><span><b>澳洲牛奶公司只收現金</b><span class="n">第二天早餐</span></span></label></li><li><label><input type="checkbox" id="i11"><span>500 元大鈔先在大地方用<span class="n">Pici、中環街市、7-Eleven</span></span></label></li><li><label><input type="checkbox" id="i12"><span>多留 100 元<span class="n">小攤、茶餐廳好用</span></span></label></li><li><label><input type="checkbox" id="i13"><span>現金分開放<span class="n">分給 2–3 個人或兩個地方</span></span></label></li></ul></section><section><h2>🇭🇰 在香港的小常識<small></small></h2><ul><li><label><input type="checkbox" id="i14"><span>手扶梯<b>靠右站</b><span class="n">左邊讓人走</span></span></label></li><li><label><input type="checkbox" id="i15"><span><b>港鐵車廂內不能吃喝</b><span class="n">會被罰款</span></span></label></li><li><label><input type="checkbox" id="i16"><span>過馬路看地上的字<span class="n">車從<b>右邊</b>來，跟台灣相反</span></span></label></li><li><label><input type="checkbox" id="i17"><span>不用給小費<span class="n">帳單通常已含 10% 服務費</span></span></label></li><li><label><input type="checkbox" id="i18"><span>旺角、女人街人多<span class="n">錢包手機放前面，小心扒手</span></span></label></li></ul></section><section><h2>🆘 走散或出事<small></small></h2><ul><li><label><input type="checkbox" id="i19"><span><b>住哪裡</b><span class="n">Hotel Benito 華國酒店・尖沙咀金馬倫道 7 號</span></span></label></li><li><label><input type="checkbox" id="i20"><span><b>緊急電話 999</b><span class="n">警察、救護車、消防</span></span></label></li><li><label><input type="checkbox" id="i21"><span>走散就回飯店大廳等<span class="n">手機保持有電</span></span></label></li></ul></section><div class="foot"><span>勾選只存在這支手機・最後更新 2026/11/02 14:32（台灣時間）</span><button>全部重來</button></div><p style="margin-top:16px"><a class="sw" href="hk-pack.html">→ 看行李清單</a></p></div><script>const K=document.body.dataset.k;let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const bx=[...document.querySelectorAll('li input')];
function up(){const d=bx.filter(x=>x.checked).length;document.querySelector('.fill').style.width=(d/bx.length*100)+'%';document.querySelector('.cnt').textContent=d+' / '+bx.length;
document.querySelectorAll('section').forEach(s=>{const i=[...s.querySelectorAll('input')];const c=s.querySelector('h2 small');if(c&&i.length)c.textContent=i.filter(x=>x.checked).length+'/'+i.length})}
bx.forEach(x=>{x.checked=!!S[x.id];x.onchange=()=>{S[x.id]=x.checked;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}up()}});
document.querySelector('button').onclick=()=>{if(!confirm('全部取消勾選？'))return;S={};try{localStorage.removeItem(K)}catch(e){}bx.forEach(x=>x.checked=false);up()};up();</script></body></html>
